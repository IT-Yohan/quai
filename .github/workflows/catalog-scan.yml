# One-off research run (branch catalog-scan only): download counts of the
# graphical apps that only ship RPMs, what quai serves for each on Fedora, and
# a dnf test transaction for the most downloaded ones.
name: Catalog scan
on:
  push:
    branches: [catalog-scan]
permissions:
  contents: write
jobs:
  usage:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:43
    timeout-minutes: 180
    steps:
      - name: Tools and quai from COPR
        run: |
          dnf -y -q install git python3 curl dnf5-plugins
          dnf -y -q copr enable it-yohan/quai
          dnf -y -q install quai
          quai --version
      - uses: actions/checkout@v6
      - name: Scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOP: "50"
        run: python3 scan/usage.py scan/spares.txt scan/spares.json
      - name: Save the results on the branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add scan/spares.json
          git commit -q -m "Usage scan results"
          git push origin HEAD:catalog-scan
