name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fedora:
    name: Fedora ${{ matrix.fedora }} (dnf5)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        fedora: ["42", "43"]
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install cargo rust clippy rustfmt gcc gcc-c++ git make \
            gtk4-devel libadwaita-devel qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kirigami kf6-qqc2-desktop-style rpm-build createrepo_c python3 \
            desktop-file-utils libappstream-glib
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test --workspace
      - name: End-to-end test with dnf5, including the Kirigami frontend
        run: |
          cargo build --workspace
          QUAI_E2E_KDE=system tests/e2e/run.sh target/debug
      - name: Frontend chosen by the desktop at install time
        run: tests/packaging/weak-deps.sh
      - name: Validate desktop integration files
        run: |
          desktop-file-validate data/desktop/io.github.quai.Quai.desktop
          appstream-util validate-relax --nonet data/metainfo/io.github.quai.Quai.metainfo.xml
