name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fedora:
    name: Fedora ${{ matrix.fedora }} (dnf5)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        fedora: ["42", "43"]
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install cargo rust clippy rustfmt gcc gcc-c++ git make \
            gtk4-devel libadwaita-devel qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kirigami kf6-qqc2-desktop-style rpm-build createrepo_c python3 \
            desktop-file-utils libappstream-glib appstream gettext glibc-langpack-fr man-db
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test --workspace
      - name: Translations are complete and up to date
        run: make check-po
      - name: Spec License tags match the linked crates
        run: packaging/licenses.py --check
      - name: End-to-end test with dnf5, including the Kirigami frontend
        run: |
          cargo build --workspace
          make translations
          QUAI_E2E_KDE=system tests/e2e/run.sh target/debug
      - name: Frontend chosen by the desktop at install time
        run: tests/packaging/weak-deps.sh
      - name: Validate the translated desktop integration files
        run: |
          desktop-file-validate target/generated/io.github.quai.Quai.desktop
          appstream-util validate-relax --nonet target/generated/io.github.quai.Quai.metainfo.xml
          appstreamcli validate --no-net target/generated/io.github.quai.Quai.metainfo.xml
      - name: Man pages and shell completions
        run: |
          make docs TARGET_DIR=target/debug
          bash -n target/generated/completions/quai.bash
          LC_ALL=C man --warnings -l target/generated/man/quai-add.1 >/dev/null
