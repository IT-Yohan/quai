[package]
name = "quai-kde"
description = "KDE Plasma frontend for quai (Kirigami)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.82"

[[bin]]
name = "quai-kde"
path = "src/main.rs"

[dependencies]
quai-types = { path = "../quai-types" }
quai-i18n = { path = "../quai-i18n" }
cxx = "1"
cxx-qt = "0.8"
cxx-qt-lib = "0.8"
libc = "0.2"
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.8"
