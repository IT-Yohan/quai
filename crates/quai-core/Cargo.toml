[package]
name = "quai-core"
description = "Engine of quai: forges, RPM headers, repodata generation and signing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
quai-types = { path = "../quai-types" }
quai-i18n = { path = "../quai-i18n" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
libc = "0.2"
percent-encoding = "2"
pgp = "0.21"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync", "time", "rt", "macros", "process"] }
toml = "0.9"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
